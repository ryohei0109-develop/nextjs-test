name: CI-CD to App Runner

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC用（超重要）
      contents: read

    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: nextjs-test      # ←ECRに作るリポジトリ名
      IMAGE_TAG: ${{ github.sha }}
      APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:service/nextjs-test/xxxxxxxxxxxxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # まずは素のNodeでビルドが通るか早期チェック（失敗ならここで止める）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build

      # AWS 認証（OIDCで鍵レス）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ararn:aws:iam::775209358765:role/github-oidc-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # ECR login
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker build & push
      - name: Build image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
      - name: Tag & Push
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG
          docker push ${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG

      # App Runner 更新（ローリングデプロイ）
      - name: Update App Runner service
        run: |
          aws apprunner update-service \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'"${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "3000",
                  "RuntimeEnvironmentVariables": [
                    {"Name":"DATABASE_URL","Value":"'"${{ secrets.PROD_DATABASE_URL }}"'"},
                    {"Name":"NEXTAUTH_URL","Value":"'"${{ secrets.NEXTAUTH_URL }}"'"},
                    {"Name":"NEXTAUTH_SECRET","Value":"'"${{ secrets.NEXTAUTH_SECRET }}"'"}
                  ]
                }
              }
            }'
