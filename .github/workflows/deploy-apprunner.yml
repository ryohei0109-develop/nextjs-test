name: CI-CD to App Runner

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}   # ←手動実行できるように

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: nextjs-test
      IMAGE_TAG: ${{ github.sha }}
      APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:service/nextjs-test/xxxxxxxxxxxxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build

      # --- Secret の存在チェック（空だと落とす） ---
      - name: Assert DATABASE_URL exists
        run: |
          if [ "${{ secrets.DATABASE_URL }}" = "" ]; then
            echo "::error::Missing GitHub Secret: DATABASE_URL"
            exit 1
          fi
          echo "OK: DATABASE_URL is set."
      # -----------------------------------

      # 本番DBにマイグレーション（Neon/RDSどちらでもOK）
      - name: Run Prisma migrate (prod DB)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # AWS 認証（OIDC）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::775209358765:role/github-oidc-deploy-role"
          aws-region: ${{ env.AWS_REGION }}

      # ECR login
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker build & push
      - name: Build image
        run: docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag & Push
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG
          docker push ${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:$IMAGE_TAG

      # App Runner 更新（環境変数は dict 形式で渡す！）
      - name: Update App Runner service
        run: |
          aws apprunner update-service \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"3000\",
                  \"RuntimeEnvironmentVariables\": {
                    \"DATABASE_URL\": \"${{ secrets.DATABASE_URL }}\"
                  }
                }
              }
            }"
